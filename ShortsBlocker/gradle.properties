# Project-wide Gradle settings.

# Required for projects depending on androidx.* libraries (AGP 8+ enforces this).
android.useAndroidX=true

# We don't depend on any legacy android.support.* artifacts, so jetifier is unneeded.
android.enableJetifier=false

# Daemon JVM args.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin code style.
kotlin.code.style=official

# Only generate R class entries for resources actually used by this app.
android.nonTransitiveRClass=true
